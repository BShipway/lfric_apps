# PDC Paper Test 7.4: Moist Held-Suarez
# =======================================
# Extension of the Held-Suarez test with moisture: adds an explicit
# moisture source (surface evaporation proxy via vapour forcing),
# transport, and saturation adjustment (evap_condense).
#
# Following Frierson et al. (2006) simplified moist framework.
#
# Demonstrates: moisture transport, condensation tendency via moist
# factors, precipitation as a diagnostic, variable heat capacity
# conversions (theta_d <-> theta_m).
#
# Mechanisms exercised: A (DOF injection), C (inter-space conversion),
#                       E (SI coupling), F (moisture formulation)
# Reference: Frierson et al. (2006)

[namelist:external_forcing]
hs_random=.false.
theta_forcing='held_suarez'
wind_forcing='held_suarez'
vapour_forcing='profile'

[namelist:extrusion]
domain_height=30000.0
method='dcmip'
number_of_layers=30

[namelist:formulation]
eos_method='projected'
moisture_formulation='traditional'
shallow=.false.
theta_moist_source=.true.
use_physics=.true.

[namelist:idealised]
test='deep_baroclinic_wave'

[namelist:initial_wind]
profile='deep_baroclinic_steady'

[namelist:initialization]
zero_w2v_wind=.true.

[namelist:io]
diagnostic_frequency=24
write_diag=.true.

[namelist:physics]
evap_condense_placement='fast'
limit_drag_incs=.false.
sample_physics_scalars=.true.
sample_physics_winds=.true.
sample_physics_winds_correction=.false.

[namelist:section_choice]
aerosol='none'
boundary_layer='none'
chemistry='none'
cloud='evap_condense'
external_forcing=.true.
methane_oxidation=.false.
microphysics='none'
orographic_drag='none'
radiation='none'
spectral_gwd='none'
stochastic_physics='none'
surface='none'

[namelist:vapour_forcing]
coordinate='height'
heights=0.0,5000.0,10000.0,30000.0
number_heights=4
number_times=1
profile_data=1.0e-5,5.0e-6,1.0e-7,0.0
times=0.0

[namelist:timestepping]
dt=1200.0
outer_iterations=2
inner_iterations=2
