# Rose app opt conf to run the PMSL diagnostic with the SOR solver (fixed omega)
# NOTE: The SOR kernel uses a parallel (all-cells-at-once) update, which limits
# omega to <= 1.0 for stability. With omega=1.0 (default) this is equivalent to
# the Jacobi solver. Use pmsl_solver='chebyshev' for the efficient solver.
# Setting omega=0.0 triggers the adaptive default (omega=1.0).

[namelist:physics]
pmsl_solver='sor'
pmsl_omega=0.0
