# Rose app opt conf to run the PMSL diagnostic with the SOR solver
# omega=0.0 triggers adaptive optimal omega computation at runtime based on mesh size:
#   omega_opt = 2 / (1 + sin(pi / (cells_per_side + 1)))
# which gives ~3.7x speedup at C12, ~7.9x at C48, ~36x at C224, ~143x at C896
# (fewer iterations needed for equivalent convergence vs the Jacobi method)

[namelist:physics]
pmsl_solver='sor'
pmsl_omega=0.0
