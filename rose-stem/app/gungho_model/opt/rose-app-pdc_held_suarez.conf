# PDC Paper Test 7.3: Held-Suarez Climate Test
# ==============================================
# Held & Suarez (1994) idealised forcing: Newtonian relaxation of
# temperature and Rayleigh friction in the boundary layer.
#
# Demonstrates physics tendency coupling (Mechanism E): idealised
# "physics" tendencies injected into the SI RHS. Tests the
# explicit-physics / implicit-dynamics splitting with no real physics.
#
# This is functionally equivalent to existing rose-app-held-suarez.conf
# with explicit settings for paper reproducibility and longer integration.
#
# Mechanisms exercised: E (SI coupling), A (DOF injection)
# Reference: Held & Suarez (1994)

[namelist:external_forcing]
hs_random=.false.
theta_forcing='held_suarez'
wind_forcing='held_suarez'

[namelist:extrusion]
domain_height=30000.0
method='dcmip'
number_of_layers=30

[namelist:formulation]
moisture_formulation='dry'
shallow=.false.
use_physics=.true.

[namelist:idealised]
test='deep_baroclinic_wave'

[namelist:initial_wind]
profile='deep_baroclinic_steady'

[namelist:io]
diagnostic_frequency=24
write_diag=.true.

[namelist:physics]
limit_drag_incs=.false.
sample_physics_scalars=.true.
sample_physics_winds=.true.
sample_physics_winds_correction=.false.

[namelist:section_choice]
boundary_layer='none'
chemistry='none'
external_forcing=.true.
orographic_drag='none'
radiation='none'
spectral_gwd='none'
stochastic_physics='none'
surface='none'

[namelist:timestepping]
dt=1200.0
outer_iterations=2
inner_iterations=2
