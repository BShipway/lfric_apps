# Rose app opt conf to run the PMSL diagnostic with the Chebyshev-accelerated solver
# This is the recommended efficient solver:
#   - Same parallel SOR kernel per iteration as Jacobi (fully OMP-parallel)
#   - Applies Chebyshev-optimal weights each iteration
#   - Converges in O(sqrt(N)) iterations vs O(N) for Jacobi
#   - Theoretical speedup: ~7x for C12, ~14x for C48, ~30x for C224, ~62x for C896
# No pmsl_omega parameter needed (it is ignored for the Chebyshev solver)

[namelist:physics]
pmsl_solver='chebyshev'
pmsl_omega=0.0
