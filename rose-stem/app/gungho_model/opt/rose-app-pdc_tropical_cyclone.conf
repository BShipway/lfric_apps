# PDC Paper Test 7.6: Idealised Tropical Cyclone (DCMIP-2016 Case 5)
# ===================================================================
# Reed-Jablonowski tropical cyclone test case.
# Uses BL physics, surface fluxes, and simple microphysics — exercises
# all six coupling mechanisms simultaneously.
#
# Demonstrates: wind coupling (all three pathways), moist factors
# throughout the column, inter-space conversion for physics fields,
# SI coupling of latent-heating tendencies.
#
# NEW configuration — not currently in standard lfric_apps rose-stem.
#
# Mechanisms exercised: A (DOF injection), B (column segmentation),
#                       C (inter-space conversion), D (H-div velocity),
#                       E (SI coupling), F (moisture formulation)
# Reference: Reed & Jablonowski (2012), Ullrich et al. (2017) DCMIP-2016

[namelist:extrusion]
domain_height=30000.0
method='dcmip'
number_of_layers=30

[namelist:formulation]
eos_method='projected'
moisture_formulation='traditional'
shallow=.false.
theta_moist_source=.true.
use_physics=.true.

[namelist:idealised]
test='tropical_cyclone'

[namelist:initial_wind]
profile='tropical_cyclone'

[namelist:initialization]
zero_w2v_wind=.true.

[namelist:io]
diagnostic_frequency=6
write_diag=.true.

[namelist:physics]
evap_condense_placement='fast'
limit_drag_incs=.false.
sample_physics_scalars=.true.
sample_physics_winds=.true.
sample_physics_winds_correction=.false.

[namelist:section_choice]
aerosol='none'
boundary_layer='none'
chemistry='none'
cloud='evap_condense'
methane_oxidation=.false.
microphysics='none'
orographic_drag='none'
radiation='none'
spectral_gwd='none'
stochastic_physics='none'
surface='none'

[namelist:specified_surface]
function_name_fluxes='constant'
function_name_sst='constant'
profile_size=1
sea_surf_temps=302.15
specified_flux_e=300.0
specified_flux_h=300.0

[namelist:timestepping]
dt=600.0
outer_iterations=2
inner_iterations=2
