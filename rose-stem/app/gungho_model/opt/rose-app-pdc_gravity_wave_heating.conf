# PDC Paper Test 7.7: Gravity-Wave Response to Localised Heating
# ===============================================================
# Impose a localised diabatic heating on the sphere (tropical hotspot)
# and measure the gravity-wave response.
#
# Demonstrates the SI method's treatment of physics tendencies: the
# heating is explicit on the RHS, and the SI solver must propagate the
# resulting gravity waves stably at timesteps exceeding the acoustic CFL.
#
# Shows convergence as dt/dt_CFL increases — analogous to Demo 05.
#
# NEW configuration — builds on the temperature tendency forcing
# mechanism used by force_profile test.
#
# Mechanisms exercised: E (SI coupling), A (DOF injection)
# Reference: Paper section 7.7

[namelist:external_forcing]
theta_forcing='temp_tend'
wind_forcing='none'

[namelist:extrusion]
domain_height=30000.0
method='dcmip'
number_of_layers=30

[namelist:formulation]
moisture_formulation='dry'
shallow=.false.
use_physics=.true.

[namelist:idealised]
test='deep_baroclinic_wave'

[namelist:initial_wind]
profile='deep_baroclinic_steady'

[namelist:io]
diagnostic_frequency=6
write_diag=.true.

[namelist:physics]
limit_drag_incs=.false.
sample_physics_scalars=.true.
sample_physics_winds=.true.
sample_physics_winds_correction=.false.

[namelist:section_choice]
boundary_layer='none'
chemistry='none'
external_forcing=.true.
orographic_drag='none'
radiation='none'
spectral_gwd='none'
stochastic_physics='none'
surface='none'

[namelist:temp_tend_data]
coordinate='height'
heights=0.0,5000.0,10000.0,15000.0,20000.0,30000.0
number_heights=6
number_times=2
profile_data=0.0,0.001,0.002,0.001,0.0,0.0,0.0,0.001,0.002,0.001,0.0,0.0
times=0.0,86400.0
number_heights=6
number_times=1
profile_data=0.0,0.001,0.002,0.001,0.0,0.0
times=0.0

[namelist:timestepping]
dt=600.0
outer_iterations=2
inner_iterations=2
