# PDC Paper Test 7.1: Dry Baroclinic Wave (DCMIP-2016 Case 4)
# ============================================================
# Validation baseline: dry dynamical core on the sphere.
# Replicates the Part II baroclinic wave to confirm the spherical
# dynamical core reproduces published results.
#
# This is functionally equivalent to the existing rose-app-baroclinic.conf
# with explicit settings for paper reproducibility.
#
# Mechanisms exercised: None (dry baseline)
# Reference: Ullrich et al. (2017) DCMIP-2016, Melvin et al. (2024) Part II

[namelist:extrusion]
domain_height=30000.0
method='dcmip'
number_of_layers=30

[namelist:formulation]
moisture_formulation='dry'
shallow=.false.
use_physics=.false.

[namelist:idealised]
test='deep_baroclinic_wave'

[namelist:initial_wind]
profile='deep_baroclinic_perturbed'

[namelist:io]
diagnostic_frequency=24
write_diag=.true.

[namelist:timestepping]
dt=900.0
outer_iterations=2
inner_iterations=2
