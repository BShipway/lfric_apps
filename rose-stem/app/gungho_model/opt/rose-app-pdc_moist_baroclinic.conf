# PDC Paper Test 7.2: Moist Baroclinic Wave (DCMIP-2016 Case 4 + moisture)
# =========================================================================
# Extends the dry baroclinic wave with water vapour, simple large-scale
# condensation (evap_condense), and moist EOS factors.
#
# Demonstrates: moisture transport on Wtheta, moist EOS via gas_law and
# total_mass factors, latent heating via theta tendency, inter-space
# conversion for physics fields.
#
# Based on existing rose-app-moist_baroclinic_orog.conf but WITHOUT
# orography — a cleaner test for the paper.
#
# Mechanisms exercised: C (inter-space conversion), E (SI coupling),
#                       F (moisture formulation)

[namelist:extrusion]
domain_height=30000.0
method='dcmip'
number_of_layers=30

[namelist:formulation]
eos_method='projected'
moisture_formulation='traditional'
shallow=.false.
theta_moist_source=.true.
use_physics=.true.

[namelist:idealised]
test='deep_baroclinic_wave'

[namelist:initial_wind]
profile='deep_baroclinic_perturbed'

[namelist:initialization]
zero_w2v_wind=.true.

[namelist:io]
diagnostic_frequency=24
write_diag=.true.

[namelist:physics]
evap_condense_placement='fast'
limit_drag_incs=.false.
sample_physics_scalars=.true.
sample_physics_winds=.true.
sample_physics_winds_correction=.false.

[namelist:section_choice]
aerosol='none'
boundary_layer='none'
chemistry='none'
cloud='evap_condense'
methane_oxidation=.false.
microphysics='none'
orographic_drag='none'
radiation='none'
spectral_gwd='none'
stochastic_physics='none'
surface='none'

[namelist:timestepping]
dt=900.0
outer_iterations=2
inner_iterations=2
